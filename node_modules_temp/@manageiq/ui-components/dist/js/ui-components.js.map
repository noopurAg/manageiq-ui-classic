module.exports = "<div ng-if=\"vm.modalTabIsSet('options')\">\n  <form class=\"form-horizontal\">\n    <div pf-form-group pf-label=\"{{'Required'|translate}}\">\n      <input bs-switch\n             ng-model=\"vm.modalData.required\"\n             type=\"checkbox\"\n             switch-on-text=\"{{'Yes'|translate}}\"\n             switch-off-text=\"{{'No'|translate}}\">\n    </div>\n    <div pf-form-group pf-label=\"{{'Read only'|translate}}\">\n      <input bs-switch\n             ng-model=\"vm.modalData.read_only\"\n             type=\"checkbox\"\n             switch-on-text=\"{{'Yes'|translate}}\"\n             switch-off-text=\"{{'No'|translate}}\">\n    </div>\n    <div pf-form-group pf-label=\"{{'Visible'|translate}}\">\n      <input bs-switch\n             ng-model=\"vm.modalData.visible\"\n             type=\"checkbox\"\n             switch-on-text=\"{{'Yes'|translate}}\"\n             switch-off-text=\"{{'No'|translate}}\">\n    </div>\n    <div pf-form-group pf-label=\"{{'Category'|translate}}\">\n      <select class=\"form-control\" miq-select\n              ng-change=\"vm.setupCategoryOptions()\"\n              ng-model=\"vm.modalData.options.category_id\">\n        <option selected=\"selected\" value=\"\" translate>None</option>\n        <option ng-repeat=\"category in vm.categories.resources\" value=\"{{category.id.toString()}}\">{{category.description}}</option>\n      </select>\n    </div>\n    <div ng-if=\"!vm.modalData.options.category_single_value\"\n         pf-form-group pf-label=\"{{'Single value'|translate}}\">\n      <input bs-switch\n             ng-model=\"vm.modalData.options.force_single_value\"\n             type=\"checkbox\"\n             switch-on-text=\"{{'Yes'|translate}}\"\n             switch-off-text=\"{{'No'|translate}}\">\n    </div>\n    <div pf-form-group pf-label=\"{{'Value type'|translate}}\">\n      <select class=\"form-control\" miq-select\n              ng-model=\"vm.modalData.data_type\">\n        <option value=\"integer\" translate>Integer</option>\n        <option selected=\"selected\" value=\"string\" translate>String</option>\n      </select>\n    </div>\n    <div pf-form-group pf-label=\"{{'Sort by'|translate}}\">\n      <select class=\"form-control\" miq-select\n              ng-model=\"vm.modalData.options.sort_by\">\n        <option value=\"none\" translate>None</option>\n        <option value=\"description\" translate>Description</option>\n        <option value=\"value\" translate>Value</option>\n      </select>\n    </div>\n    <div pf-form-group pf-label=\"{{'Sort order'|translate}}\">\n      <select class=\"form-control\" miq-select\n              ng-model=\"vm.modalData.options.sort_order\">\n        <option selected=\"selected\" value=\"ascending\" translate>Ascending</option>\n        <option value=\"descending\" translate>Descending</option>\n      </select>\n    </div>\n    <div pf-form-group class=\"form-inline\" pf-label=\"{{'Entries'|translate}}\" required>\n      <div ng-repeat=\"entry in vm.currentCategoryEntries().children\">\n        <input id=\"label\" name=\"label\"\n               ng-model=\"entry.description\" type=\"text\" placeholder=\"{{'Key'|translate}}\" readonly/>\n      </div>\n    </div>\n    <dialog-editor-modal-field-template template=\"fields-to-refresh.html\"\n                                        modal-data=\"vm.modalData\">\n    </dialog-editor-modal-field-template>\n  </form>\n</div>\n"
